name: Build and Package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (all, windows, macos, android)"
        required: false
        default: "all"

env:
  NODE_VERSION: "20"
  RUST_VERSION: "stable"
  APP_NAME: "openmarketing-hub"

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Build backend
        run: npm run build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/

  build-desktop-windows:
    needs: build-backend
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 25.2.9519653

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: "~/.cargo/bin"
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: "~/.cargo/registry"
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: "~/.cargo/git"
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: desktop/dist/

      - name: Install Node dependencies
        run: |
          cd desktop && npm ci

      - name: Install Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build Windows installer
        run: |
          cd desktop && npm run package:windows
        env:
          TAIKI_SKIP_ANDROID: true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/

  build-desktop-macos:
    needs: build-backend
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: "~/.cargo/bin"
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: "~/.cargo/registry"
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: desktop/dist/

      - name: Install Node dependencies
        run: |
          cd desktop && npm ci

      - name: Install macOS target
        run: rustup target add x86_64-apple-darwin

      - name: Build macOS .dmg
        run: |
          cd desktop && npm run package:macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/src-tauri/target/release/

  build-desktop-android:
    needs: build-backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 25.2.9519653

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: "~/.cargo/bin"
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: desktop/dist/

      - name: Install Node dependencies
        run: |
          cd desktop && npm ci

      - name: Install Android target
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk android-sdk-build-tools android-sdk-platform-tools
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/usr/lib/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          cd desktop && npm run package:android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: desktop/src-tauri/target/aarch64-linux-android/release/

  build-desktop-all:
    needs: [build-desktop-windows, build-desktop-macos, build-desktop-android]
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'all' || github.event_name == 'workflow_dispatch'
    steps:
      - name: All builds completed
        run: echo "All platform builds completed successfully"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Prisma audit
        run: npx prisma db pull || true
        continue-on-error: true
