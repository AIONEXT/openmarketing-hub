[package]
name = "openmarketing-hub"
version = "1.0.0"
description = "OpenMarketing Hub - All-in-one SEO and marketing automation platform"
authors = ["OpenMarketing Hub"]
edition = "2021"

[lib]
name = "openmarketing_hub_lib"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "openmarketing-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["android"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["android"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
android = ["tauri/android"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release-android]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
